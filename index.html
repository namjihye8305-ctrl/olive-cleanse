<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE ORIGINAL CLEANSE · GREEN MONSTER | Brand Week Plus</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<!-- ================================================================
     Mobile 750px 에디토리얼 · 새 디자인(코딩/images) 전체 반영
     * .hero-swipe / .swipe  = 2장 좌우 자동 스와이프 (+ 타이틀/텍스트 오버레이)
     * .photo-fade           = 3장 자동 크로스페이드
     * .static-txt           = 사진 1장 + 텍스트 오버레이 (모션 없음)
     ================================================================ -->
<main class="canvas">

  <header class="topbar">
    <img src="assets2/gnb.jpg" alt="매거진" />
  </header>

  <!-- HERO -->
  <div class="hero-swipe">
    <div class="hero-swipe__track">
      <img src="assets2/hero-a.jpg" alt="" />
      <img src="assets2/hero-b.jpg" alt="" />
    </div>
    <img class="hero-swipe__title" src="assets2/hero-title.png" alt="THE ORIGINAL CLEANSE" />
  </div>
  <div class="ovl-wrap">
    <img class="hero-panel" src="assets2/hero-panel.png" alt="GREEN MONSTER · HOLLYWOOD 48-HOUR" />
    <img class="logo-wobble" style="top:0%; left:76%; width:19.33%;" src="assets2/brand-logo.png" alt="Brand Week" />
  </div>

  <!-- 03 Summer Essential -->
  <div class="static-txt">
    <img src="assets2/r03.jpg" alt="" />
    <img class="reveal-txt" src="assets2/r03-text.png" alt="" />
  </div>
  <!-- 04 Benefit -->
  <div class="ovl-wrap">
    <img src="assets2/r04.jpg" alt="" />
    <img class="pulse-btn" style="top:31.38%; left:81.6%; width:5.867%;" src="assets2/r04-btn.png" alt="" />
  </div>
  <!-- 05 Chapter 01 title -->
  <img src="assets2/r05.jpg" alt="" />

  <!-- 06 스와이프 + 텍스트 -->
  <div class="swipe">
    <div class="swipe__track">
      <img src="assets2/r06-a.jpg" alt="" />
      <img src="assets2/r06-b.jpg" alt="" />
    </div>
    <img class="swipe__overlay reveal-txt" style="top:0;" src="assets2/r06-txt-top.png" alt="" />
    <img class="swipe__overlay reveal-txt dir-left" style="top:54.27%;" src="assets2/r06-txt-bottom.png" alt="" />
  </div>

  <!-- 07 Exercise Diet -->
  <div class="ovl-wrap">
    <img src="assets2/r07.jpg" alt="" />
    <img class="reveal-txt dir-right" style="position:absolute; top:42.43%; left:-6.4%; width:112.8%;" src="assets2/r07-overlay.png" alt="" />
  </div>

  <!-- 08 페이드인아웃 -->
  <div class="fade2">
    <img src="assets2/r08-a.jpg" alt="" />
    <img src="assets2/r08-b.jpg" alt="" />
  </div>

  <!-- 09 사진+텍스트(고정) -->
  <div class="static-txt">
    <img src="assets2/r09.png" alt="" />
    <img class="reveal-txt dir-left" src="assets2/r09-txt.png" alt="" />
  </div>

  <!-- 10 Chapter 02 title -->
  <img src="assets2/r10.jpg" alt="" />

  <!-- 11 사진+텍스트(고정) -->
  <div class="static-txt">
    <img src="assets2/r11.png" alt="" />
    <img class="reveal-txt dir-right" src="assets2/r11-txt.png" alt="" />
  </div>

  <!-- 12 크로스페이드 x3 (빠른 속도) -->
  <div class="photo-fade">
    <img src="assets2/r12-a.jpg" alt="" />
    <img src="assets2/r12-b.jpg" alt="" />
    <img src="assets2/r12-c.jpg" alt="" />
  </div>

  <!-- 13 사진+텍스트(고정) -->
  <div class="static-txt">
    <img src="assets2/r13.jpg" alt="" />
    <img class="reveal-txt" src="assets2/r13-txt.png" alt="" />
  </div>

  <!-- 14 essential oil -->
  <div class="static-txt">
    <img src="assets2/r14.jpg" alt="" />
    <img class="reveal-txt" src="assets2/r14-text.png" alt="" />
  </div>

  <!-- 15 사진 + 텍스트(왼쪽→오른쪽 등장) -->
  <div class="static-txt">
    <img src="assets2/r15.png" alt="" />
    <img class="reveal-txt dir-left" src="assets2/r15-txt.png" alt="" />
  </div>

  <!-- 16 가격 -->
  <img src="assets2/r16.jpg" alt="" />

  <!-- 17 기본 배경 위에 스크롤 시 아래→위로 등장 후 페이드인아웃 (How to Drink) -->
  <div class="rise-fade">
    <img class="rf-base" src="assets2/r17-base.jpg" alt="" />
    <img class="rf-a" src="assets2/r17-a.png" alt="" />
    <img class="rf-b" src="assets2/r17-b.png" alt="" />
  </div>

  <!-- 18 Light/Basic 스케줄 : 주스 아이콘 12개가 순서대로 하나씩 나타남(무한반복) -->
  <div class="glass-wrap">
    <img src="assets2/r18.jpg" alt="" />
    <img class="glass-icon glass-icon-0" style="left:15.333%;top:36.254%;width:6.933%;" src="assets2/glass.png" alt="" />
    <img class="glass-icon glass-icon-1" style="left:33.2%;top:36.254%;width:6.933%;" src="assets2/glass.png" alt="" />
    <img class="glass-icon glass-icon-2" style="left:50.933%;top:36.254%;width:6.933%;" src="assets2/glass.png" alt="" />
    <img class="glass-icon glass-icon-3" style="left:68.8%;top:36.254%;width:6.933%;" src="assets2/glass.png" alt="" />
    <img class="glass-icon glass-icon-4" style="left:15.333%;top:72.106%;width:6.933%;" src="assets2/glass.png" alt="" />
    <img class="glass-icon glass-icon-5" style="left:33.2%;top:72.106%;width:6.933%;" src="assets2/glass.png" alt="" />
    <img class="glass-icon glass-icon-6" style="left:50.933%;top:72.106%;width:6.933%;" src="assets2/glass.png" alt="" />
    <img class="glass-icon glass-icon-7" style="left:68.8%;top:72.106%;width:6.933%;" src="assets2/glass.png" alt="" />
    <img class="glass-icon glass-icon-8" style="left:15.333%;top:82.154%;width:6.933%;" src="assets2/glass.png" alt="" />
    <img class="glass-icon glass-icon-9" style="left:33.2%;top:82.154%;width:6.933%;" src="assets2/glass.png" alt="" />
    <img class="glass-icon glass-icon-10" style="left:50.933%;top:82.154%;width:6.933%;" src="assets2/glass.png" alt="" />
    <img class="glass-icon glass-icon-11" style="left:68.8%;top:82.154%;width:6.933%;" src="assets2/glass.png" alt="" />
    <img class="day-badge" style="left:73.067%;top:36.897%;width:16.667%;" src="assets2/badge-day1.png" alt="1일차" />
    <img class="day-badge" style="left:73.067%;top:72.829%;width:16.667%;" src="assets2/badge-day1.png" alt="1일차" />
    <img class="day-badge" style="left:73.067%;top:83.039%;width:16.667%;" src="assets2/badge-day2.png" alt="2일차" />
  </div>

  <!-- 19 붓는 사진 : 스크롤하면 줌인 + 블러→선명 -->
  <div class="scrub-zoom blur-scrub">
    <img src="assets2/r19.jpg" alt="" />
  </div>

  <!-- 20 : 스크롤하는 동안만 20-1 → 20-2로 슬라이드 -->
  <div class="scrub-slide slide-late">
    <div class="scrub-slide__track">
      <img src="assets2/r20-a.jpg" alt="" />
      <img src="assets2/r20-b.jpg" alt="" />
    </div>
  </div>

  <!-- 21 Chapter 03 title -->
  <img src="assets2/r21.jpg" alt="" />

  <!-- 22 크로스페이드 x3 -->
  <div class="photo-fade">
    <img src="assets2/r22-a.jpg" alt="" />
    <img src="assets2/r22-b.png" alt="" />
    <img src="assets2/r22-c.png" alt="" />
  </div>

  <!-- 23 제품 다발 사진 -->
  <img src="assets2/r23.jpg" alt="" />
  <!-- 24 가격 -->
  <img src="assets2/r24.jpg" alt="" />
  <!-- 25 Brand Shop -->
  <img src="assets2/r25.jpg" alt="" />
  <!-- 26 크레딧/푸터 -->
  <img src="assets2/r26.jpg" alt="" />

</main>
<script src="js/reveal.js"></script>
</body>
</html>
